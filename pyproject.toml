[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-cluster-log-analyzer"
version = "0.1.0"
description = "Turn Databricks / Spark cluster logs (driver, executor, event logs) into Parquet datasets and a local web UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "duckdb>=0.10",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
databricks = ["databricks-sdk>=0.20"]
adls = ["azure-storage-file-datalake>=12.14", "azure-identity>=1.15"]
s3 = ["boto3>=1.28"]
all = ["databricks-sdk>=0.20", "azure-storage-file-datalake>=12.14", "azure-identity>=1.15", "boto3>=1.28"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
dbx-log-analyzer = "databricks_cluster_log_analyzer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
databricks_cluster_log_analyzer = ["rules.toml", "api/static/*", "api/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
